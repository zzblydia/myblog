name: Manual News Push

on:
  # 仅保留手动触发;定时新闻推送已合并到 daily_query.yml 的 news 任务
  workflow_dispatch:

jobs:
  news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: python/MyTelegramBot

      - name: Generate config.json from TGB_CONFIG
        working-directory: python/MyTelegramBot
        env:
          TGB_CONFIG: ${{ secrets.TGB_CONFIG }}
        run: |
          python - <<'PY'
          import json
          import os

          # TGB_CONFIG 是完整 JSON;先解析校验,避免写入非法内容
          config = json.loads(os.environ["TGB_CONFIG"])
          # 手动工作流固定只跑 news,不受 JSON 中 client_task 影响
          config["run_mode"] = "client"
          config["client_task"] = "news"
          with open("config/config.json", "w", encoding="utf-8") as f:
              json.dump(config, f, ensure_ascii=False, indent=4)
          PY

      - name: Run news push
        working-directory: python/MyTelegramBot
        run: python main.py
