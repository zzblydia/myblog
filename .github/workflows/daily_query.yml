name: Daily SIM Query

on:
  schedule:
    # 每天 06:00 SGT (UTC+8) = 22:00 UTC 运行
    - cron: '0 22 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  query:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: python/MyTelegramBot

      - name: Generate config.json from secrets
        working-directory: python/MyTelegramBot
        env:
          BOT_TOKEN:         ${{ secrets.BOT_TOKEN }}
          ADMIN_USER_ID:     ${{ secrets.ADMIN_USER_ID }}
          ORDER_ID:          ${{ secrets.ORDER_ID }}
          EMAIL:             ${{ secrets.EMAIL }}
          DIY_PASS:          ${{ secrets.DIY_PASS }}
        run: |
          python - <<'PY'
          import json
          import os

          # 用 Python 写 JSON,避免密码中的引号/反斜杠破坏 shell heredoc
          config = {
              "bot_token": os.environ["BOT_TOKEN"],
              "admin_user_id": os.environ["ADMIN_USER_ID"],
              "order_id": os.environ["ORDER_ID"],
              "email": os.environ.get("EMAIL", ""),
              "pass": os.environ.get("DIY_PASS", ""),
              "run_mode": "client",
              "client_task": "phone",
          }
          with open("config/config.json", "w", encoding="utf-8") as f:
              json.dump(config, f, ensure_ascii=False, indent=4)
          PY

      - name: Run query
        working-directory: python/MyTelegramBot
        run: python main.py
