name: Daily SIM & News Query

on:
  schedule:
    # 每天 06:00 SGT (UTC+8) = 22:00 UTC 运行
    - cron: '0 22 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  client:
    runs-on: ubuntu-latest
    strategy:
      # phone 与 news 互不影响:一个失败不取消另一个
      fail-fast: false
      matrix:
        client_task: [phone, news]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: python/MyTelegramBot

      - name: Generate config.json from TGB_CONFIG
        working-directory: python/MyTelegramBot
        env:
          TGB_CONFIG: ${{ secrets.TGB_CONFIG }}
          CLIENT_TASK: ${{ matrix.client_task }}
        run: |
          python - <<'PY'
          import json
          import os

          # TGB_CONFIG 是完整 JSON;先解析校验,避免写入非法内容
          config = json.loads(os.environ["TGB_CONFIG"])
          # CI 固定 client 模式,任务由 matrix 决定,避免 JSON 中的值影响调度
          config["run_mode"] = "client"
          config["client_task"] = os.environ["CLIENT_TASK"]
          with open("config/config.json", "w", encoding="utf-8") as f:
              json.dump(config, f, ensure_ascii=False, indent=4)
          PY

      - name: Run client task
        working-directory: python/MyTelegramBot
        run: python main.py
